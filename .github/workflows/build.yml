name: Build Windows installer

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: .\build.ps1
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Judgment-Arabic-Installer
          path: dist/Judgment-Arabic-Installer.exe
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Judgment-Arabic-Installer.exe
